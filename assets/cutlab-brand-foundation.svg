<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">CutLab Studio Brand Foundation Board</title>
  <desc id="desc">A premium brand foundation board for CutLab Studio, a local-first production workspace for professional video editors.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2a2c2f" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#f6f2e8" stroke-width="1" opacity="0.025"/>
    </pattern>
    <style>
      .bg { fill: #0f1012; }
      .panel { fill: #17191c; stroke: #2a2d31; stroke-width: 1; }
      .panelLight { fill: #ece7dc; stroke: #c7c0b4; stroke-width: 1; }
      .ink { fill: #f1ede3; }
      .muted { fill: #9aa0a6; }
      .subtle { fill: #666d73; }
      .teal { fill: #34d4c5; }
      .amber { fill: #f0b85a; }
      .red { fill: #d95b53; }
      .slate { fill: #59616a; }
      .rule { stroke: #34383d; stroke-width: 1; }
      .ruleLight { stroke: #c7c0b4; stroke-width: 1; }
      .thinTeal { stroke: #34d4c5; stroke-width: 2; }
      .thinAmber { stroke: #f0b85a; stroke-width: 2; }
      .thinRed { stroke: #d95b53; stroke-width: 2; }
      .headline { font-family: "Inter Tight", "Arial Narrow", Arial, sans-serif; font-weight: 700; letter-spacing: 0; }
      .sans { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
      .mono { font-family: "IBM Plex Mono", "Courier New", monospace; letter-spacing: 0; }
      .label { font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 14px; letter-spacing: 0; text-transform: uppercase; }
      .micro { font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 11px; letter-spacing: 0; text-transform: uppercase; }
    </style>
    <symbol id="cutlab-mark" viewBox="0 0 160 160">
      <rect x="18" y="24" width="20" height="112" rx="3" fill="#f1ede3"/>
      <rect x="18" y="24" width="94" height="20" rx="3" fill="#f1ede3"/>
      <rect x="18" y="116" width="94" height="20" rx="3" fill="#f1ede3"/>
      <rect x="55" y="68" width="54" height="18" rx="3" fill="#59616a"/>
      <rect x="102" y="34" width="16" height="92" rx="2" fill="#34d4c5"/>
      <rect x="117" y="98" width="30" height="20" rx="3" fill="#f0b85a"/>
      <path d="M118 34L102 50V34Z" fill="#d95b53"/>
      <path d="M118 126L102 110V126Z" fill="#d95b53"/>
      <path d="M48 52H82M48 98H92" stroke="#0f1012" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    </symbol>
    <symbol id="cutlab-mark-dark" viewBox="0 0 160 160">
      <rect x="18" y="24" width="20" height="112" rx="3" fill="#17191c"/>
      <rect x="18" y="24" width="94" height="20" rx="3" fill="#17191c"/>
      <rect x="18" y="116" width="94" height="20" rx="3" fill="#17191c"/>
      <rect x="55" y="68" width="54" height="18" rx="3" fill="#59616a"/>
      <rect x="102" y="34" width="16" height="92" rx="2" fill="#208f86"/>
      <rect x="117" y="98" width="30" height="20" rx="3" fill="#c28734"/>
      <path d="M118 34L102 50V34Z" fill="#a8403b"/>
      <path d="M118 126L102 110V126Z" fill="#a8403b"/>
      <path d="M48 52H82M48 98H92" stroke="#ece7dc" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    </symbol>
  </defs>

  <rect class="bg" width="1920" height="1200"/>
  <rect width="1920" height="1200" fill="url(#grid)" opacity="0.38"/>
  <rect width="1920" height="1200" fill="url(#scan)"/>
  <rect width="1920" height="1200" filter="url(#grain)" opacity="0.55"/>

  <g class="micro" fill="#6f767d">
    <text x="60" y="52">CUTLAB STUDIO / BRAND FOUNDATION</text>
    <text x="1688" y="52">LOCAL-FIRST POST PRODUCTION OS</text>
    <path d="M60 70H1860" stroke="#2b2e32"/>
  </g>

  <!-- Panel 1: primary logo cover -->
  <g transform="translate(60 102)" filter="url(#softShadow)">
    <rect class="panel" width="584" height="326" rx="8"/>
    <path d="M24 24H96M24 24V96M560 302H488M560 302V230" fill="none" stroke="#34383d"/>
    <use href="#cutlab-mark" x="75" y="82" width="132" height="132"/>
    <text class="headline ink" x="230" y="155" font-size="62">CutLab</text>
    <text class="headline" x="230" y="204" font-size="42" fill="#9aa0a6">Studio</text>
    <text class="label muted" x="76" y="266">Brand Foundation</text>
    <text class="mono subtle" x="76" y="291" font-size="15">Precision workspace for working editors</text>
  </g>

  <!-- Panel 2: icon mark -->
  <g transform="translate(668 102)" filter="url(#softShadow)">
    <rect class="panelLight" width="584" height="326" rx="8"/>
    <text class="label" x="32" y="42" fill="#454a4f">Icon Mark</text>
    <text class="mono" x="392" y="42" font-size="12" fill="#74706a">CUT / TIMELINE / CONTROL</text>
    <use href="#cutlab-mark-dark" x="56" y="83" width="166" height="166"/>
    <rect x="288" y="88" width="124" height="124" rx="24" fill="#15171a"/>
    <use href="#cutlab-mark" x="306" y="106" width="88" height="88"/>
    <rect x="438" y="88" width="68" height="68" rx="16" fill="#15171a"/>
    <use href="#cutlab-mark" x="448" y="98" width="48" height="48"/>
    <path d="M288 247H506" class="ruleLight"/>
    <path d="M288 267H462" class="ruleLight"/>
    <text class="mono" x="288" y="244" font-size="12" fill="#454a4f">primary app mark</text>
    <text class="mono" x="288" y="288" font-size="12" fill="#454a4f">reduced mark at small size</text>
  </g>

  <!-- Panel 3: wordmark -->
  <g transform="translate(1276 102)" filter="url(#softShadow)">
    <rect class="panel" width="584" height="326" rx="8"/>
    <text class="label muted" x="32" y="42">Wordmark</text>
    <text class="headline ink" x="70" y="164" font-size="76">CutLab Studio</text>
    <path d="M72 190H512" class="rule"/>
    <g transform="translate(72 220)">
      <rect x="0" y="0" width="76" height="28" rx="4" fill="#23262a"/>
      <text class="mono muted" x="14" y="19" font-size="11">TRACK</text>
      <rect x="88" y="0" width="92" height="28" rx="4" fill="#23262a"/>
      <text class="mono muted" x="102" y="19" font-size="11">REVISION</text>
      <rect x="192" y="0" width="86" height="28" rx="4" fill="#23262a"/>
      <text class="mono muted" x="206" y="19" font-size="11">DELIVER</text>
      <rect x="290" y="0" width="4" height="28" fill="#34d4c5"/>
    </g>
    <text class="mono subtle" x="72" y="280" font-size="13">Wide professional spacing. Editorial sans. Technical metadata layer.</text>
  </g>

  <!-- Panel 4: tagline -->
  <g transform="translate(60 452)" filter="url(#softShadow)">
    <rect class="panel" width="584" height="326" rx="8"/>
    <text class="label muted" x="32" y="42">Core Brand Idea</text>
    <text class="headline ink" x="52" y="138" font-size="56">Every edit</text>
    <text class="headline ink" x="52" y="198" font-size="56">under control.</text>
    <path d="M52 236H298" class="thinTeal"/>
    <text class="sans muted" x="52" y="274" font-size="20">Production clarity for working editors.</text>
    <circle cx="510" cy="76" r="26" fill="none" stroke="#34d4c5" stroke-width="2"/>
    <path d="M494 76H526M510 60V92" stroke="#f0b85a" stroke-width="2"/>
  </g>

  <!-- Panel 5: visual direction preview -->
  <g transform="translate(668 452)" filter="url(#softShadow)">
    <rect class="panel" width="584" height="326" rx="8"/>
    <rect x="24" y="24" width="536" height="278" rx="7" fill="#111316" stroke="#2b2f34"/>
    <g class="micro" fill="#737b83">
      <text x="44" y="54">PROJECT / CLIENT / DEADLINE</text>
      <text x="438" y="54">LOCAL</text>
    </g>
    <circle cx="523" cy="49" r="5" class="teal"/>
    <path d="M44 78H540" class="rule"/>
    <g transform="translate(44 104)">
      <text class="mono muted" x="0" y="16" font-size="12">A-CAM</text>
      <rect x="82" y="0" width="118" height="26" rx="4" fill="#263033"/>
      <rect x="212" y="0" width="76" height="26" rx="4" fill="#29313a"/>
      <rect x="300" y="0" width="154" height="26" rx="4" fill="#263033"/>
      <rect x="466" y="0" width="30" height="26" rx="4" fill="#f0b85a"/>
      <text class="mono muted" x="0" y="62" font-size="12">B-ROLL</text>
      <rect x="82" y="46" width="82" height="26" rx="4" fill="#29313a"/>
      <rect x="176" y="46" width="168" height="26" rx="4" fill="#263033"/>
      <rect x="356" y="46" width="104" height="26" rx="4" fill="#29313a"/>
      <text class="mono muted" x="0" y="108" font-size="12">REV 03</text>
      <rect x="82" y="92" width="138" height="26" rx="4" fill="#332d28"/>
      <rect x="232" y="92" width="114" height="26" rx="4" fill="#263033"/>
      <rect x="358" y="92" width="138" height="26" rx="4" fill="#2b2727"/>
      <text class="mono muted" x="0" y="154" font-size="12">DELIV</text>
      <rect x="82" y="138" width="104" height="26" rx="4" fill="#243738"/>
      <rect x="198" y="138" width="188" height="26" rx="4" fill="#263033"/>
      <rect x="398" y="138" width="98" height="26" rx="4" fill="#243738"/>
      <path d="M276 -22V184" stroke="#34d4c5" stroke-width="2"/>
      <path d="M84 198H496" stroke="#34383d"/>
      <path d="M84 198V206M168 198V206M252 198V206M336 198V206M420 198V206M496 198V206" stroke="#59616a"/>
    </g>
    <rect x="404" y="253" width="110" height="24" rx="12" fill="#172b2b" stroke="#34d4c5"/>
    <text class="mono" x="422" y="269" font-size="11" fill="#34d4c5">APPROVED</text>
  </g>

  <!-- Panel 6: color palette -->
  <g transform="translate(1276 452)" filter="url(#softShadow)">
    <rect class="panel" width="584" height="326" rx="8"/>
    <text class="label muted" x="32" y="42">Initial Color Palette</text>
    <g transform="translate(44 82)">
      <rect x="0" y="0" width="78" height="132" rx="6" fill="#0f1012" stroke="#34383d"/>
      <rect x="88" y="0" width="78" height="132" rx="6" fill="#f1ede3"/>
      <rect x="176" y="0" width="78" height="132" rx="6" fill="#34d4c5"/>
      <rect x="264" y="0" width="78" height="132" rx="6" fill="#f0b85a"/>
      <rect x="352" y="0" width="78" height="132" rx="6" fill="#d95b53"/>
      <rect x="440" y="0" width="78" height="132" rx="6" fill="#59616a"/>
      <text class="mono muted" x="39" y="164" font-size="10" text-anchor="middle">
        <tspan x="39">Cut</tspan><tspan x="39" dy="13">Charcoal</tspan>
      </text>
      <text class="mono muted" x="127" y="164" font-size="10" text-anchor="middle">
        <tspan x="127">Timeline</tspan><tspan x="127" dy="13">White</tspan>
      </text>
      <text class="mono muted" x="215" y="164" font-size="10" text-anchor="middle">
        <tspan x="215">Signal</tspan><tspan x="215" dy="13">Teal</tspan>
      </text>
      <text class="mono muted" x="303" y="164" font-size="10" text-anchor="middle">
        <tspan x="303">Edit</tspan><tspan x="303" dy="13">Amber</tspan>
      </text>
      <text class="mono muted" x="391" y="164" font-size="10" text-anchor="middle">
        <tspan x="391">Proof</tspan><tspan x="391" dy="13">Red</tspan>
      </text>
      <text class="mono muted" x="479" y="164" font-size="10" text-anchor="middle">
        <tspan x="479">Slate</tspan><tspan x="479" dy="13">Gray</tspan>
      </text>
      <text class="mono subtle" x="0" y="214" font-size="13">Accents map to live workflow states, not decoration.</text>
    </g>
  </g>

  <!-- Panel 7: typography -->
  <g transform="translate(60 802)" filter="url(#softShadow)">
    <rect class="panelLight" width="584" height="326" rx="8"/>
    <text class="label" x="32" y="42" fill="#454a4f">Typography Preview</text>
    <text class="headline" x="48" y="137" font-size="62" fill="#15171a">Inter Tight</text>
    <text class="mono" x="50" y="184" font-size="28" fill="#454a4f">IBM Plex Mono</text>
    <path d="M50 216H518" class="ruleLight"/>
    <text class="mono" x="50" y="250" font-size="14" fill="#59616a">CLIENT APPROVAL / REVISION 03 / DELIVERY 18:00</text>
    <text class="sans" x="50" y="286" font-size="18" fill="#454a4f">Large editorial decisions, precise production metadata.</text>
  </g>

  <!-- Panel 8: workflow system detail -->
  <g transform="translate(668 802)" filter="url(#softShadow)">
    <rect class="panel" width="584" height="326" rx="8"/>
    <text class="label muted" x="32" y="42">Workflow System Detail</text>
    <g transform="translate(38 78)">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#172b2b" stroke="#34d4c5"/>
      <text class="mono" x="22" y="22" font-size="12" fill="#34d4c5">SYNCED</text>
      <rect x="126" y="0" width="130" height="34" rx="17" fill="#332d28" stroke="#f0b85a"/>
      <text class="mono" x="148" y="22" font-size="12" fill="#f0b85a">IN REVIEW</text>
      <rect x="270" y="0" width="122" height="34" rx="17" fill="#322326" stroke="#d95b53"/>
      <text class="mono" x="296" y="22" font-size="12" fill="#d95b53">BLOCKED</text>
      <rect x="406" y="0" width="104" height="34" rx="17" fill="#22262a" stroke="#59616a"/>
      <text class="mono" x="430" y="22" font-size="12" fill="#9aa0a6">LOCAL</text>
    </g>
    <g transform="translate(44 150)">
      <text class="mono muted" x="0" y="-18" font-size="12">REVISION STACK</text>
      <rect x="0" y="0" width="496" height="28" rx="4" fill="#23262a"/>
      <rect x="0" y="0" width="118" height="28" rx="4" fill="#243738"/>
      <rect x="132" y="0" width="118" height="28" rx="4" fill="#332d28"/>
      <rect x="264" y="0" width="118" height="28" rx="4" fill="#23262a"/>
      <rect x="396" y="0" width="100" height="28" rx="4" fill="#2b2727"/>
      <path d="M250 -28V82" class="thinTeal"/>
      <text class="mono muted" x="0" y="72" font-size="12">RESOURCES</text>
      <text class="mono muted" x="124" y="72" font-size="12">CALENDAR</text>
      <text class="mono muted" x="250" y="72" font-size="12">REPORTS</text>
      <text class="mono muted" x="372" y="72" font-size="12">PUBLISH</text>
      <path d="M0 90H496" class="rule"/>
      <path d="M0 90V102M82 90V102M164 90V102M246 90V102M328 90V102M410 90V102M496 90V102" stroke="#59616a"/>
    </g>
  </g>

  <!-- Panel 9: brand application -->
  <g transform="translate(1276 802)" filter="url(#softShadow)">
    <rect class="panel" width="584" height="326" rx="8"/>
    <text class="label muted" x="32" y="42">Brand Application</text>
    <rect x="56" y="86" width="132" height="132" rx="30" fill="#101215" stroke="#34383d"/>
    <use href="#cutlab-mark" x="78" y="108" width="88" height="88"/>
    <g transform="translate(240 84)">
      <rect x="0" y="0" width="252" height="158" rx="10" fill="#ece7dc"/>
      <path d="M0 42H252" stroke="#c7c0b4"/>
      <text class="mono" x="22" y="28" font-size="12" fill="#454a4f">DELIVERY TAG</text>
      <text class="headline" x="22" y="90" font-size="30" fill="#15171a">Client Cut</text>
      <text class="mono" x="22" y="124" font-size="12" fill="#59616a">REV 03 / APPROVED / LOCAL</text>
      <rect x="196" y="18" width="26" height="6" fill="#34d4c5"/>
      <rect x="196" y="30" width="26" height="6" fill="#f0b85a"/>
    </g>
    <g transform="translate(58 254)">
      <use href="#cutlab-mark" x="0" y="-16" width="34" height="34"/>
      <text class="headline ink" x="46" y="10" font-size="24">CutLab Studio</text>
      <path d="M270 0H506" class="rule"/>
    </g>
  </g>

  <g class="micro" fill="#59616a">
    <text x="60" y="1166">FOUNDATION BOARD 01</text>
    <text x="1628" y="1166">NO AI AESTHETICS / EDITOR-FIRST SYSTEM</text>
  </g>
</svg>
